name: vfm_agri_env

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.14

  - numpy=1.26.4
  - pandas=2.2.3

  - matplotlib=3.9.2
  - seaborn=0.13.2

  - scipy=1.15.2

  - scikit-learn=1.6.1

  - jupyter=1.1.1
  - notebook=7.4.5
  - ipykernel=6.29.5

  - prophet=1.2.2          # conda-forge build -- avoids needing a C++ compiler for cmdstan

  - pip

  - pip:
      - plotly==6.0.1
      - xgboost==2.1.4
      - lightgbm==4.6.0
      - tensorflow==2.18.0
      - keras==3.8.0
      - statsmodels==0.14.4
      - pmdarima==2.0.4
      - streamlit==1.45.1
      - joblib==1.4.2
      - tqdm==4.67.1
      - missingno==0.5.2
      - openpyxl==3.1.5
      - xlsxwriter==3.2.2
      - torch
      - neuralforecast